<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT</title>
  </head>
  <body>
    <main>
      <article data-message-author-role="user">
        <div>What are the three largest countries in Europe by population?</div>
      </article>
      <article data-message-author-role="assistant">
        <div>The three largest countries in Europe by population are Russia, Germany, and the United Kingdom.</div>
      </article>
    </main>
  </body>
</html>
