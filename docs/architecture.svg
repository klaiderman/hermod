<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 456" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9cc4ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 H0 V40" fill="none" stroke="#163457" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="456" rx="10" fill="#0b1e39"/>
  <rect x="0" y="0" width="1200" height="456" rx="10" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="454" rx="10" fill="none" stroke="#2b4d75" stroke-width="2"/>

  <!-- Hermod -->
  <text x="34" y="46" fill="#e6f0ff" font-size="16">Hermod</text>
  <text x="34" y="66" fill="#8fb3e0" font-size="11">one HTTP request, a real signed-out browser, a classified answer</text>

  <g stroke="#9cc4ff" stroke-width="2" fill="#12335a">
    <rect x="24"  y="224" width="96"  height="52" rx="7"/>
    <rect x="144" y="224" width="140" height="52" rx="7"/>
    <rect x="312" y="220" width="150" height="60" rx="7"/>
    <rect x="520" y="150" width="160" height="60" rx="7"/>
    <rect x="520" y="322" width="240" height="60" rx="7"/>
  </g>

  <g stroke="#9cc4ff" stroke-width="2" fill="#0f3f52">
    <path d="M738,158 V202 A52,8 0 0 0 842,202 V158"/>
    <ellipse cx="790" cy="158" rx="52" ry="8"/>
  </g>

  <g fill="#e6f0ff" font-size="14" text-anchor="middle">
    <text x="72"  y="255">client</text>
    <text x="214" y="255">/v1/queries</text>
    <text x="387" y="246">ScrapeEngine</text>
    <text x="600" y="176">ChatGptStrategy</text>
    <text x="640" y="348">block detector</text>
    <text x="790" y="184">Chromium</text>
  </g>
  <g fill="#8fb3e0" font-size="10" text-anchor="middle">
    <text x="387" y="263">resilience &#183; four timers</text>
    <text x="600" y="193">drive UI &#183; read the DOM</text>
    <text x="640" y="365">status &#183; body &#183; DOM &#8594; typed errors</text>
    <text x="790" y="197">N contexts</text>
  </g>

  <!-- chatgpt.com signed-out: the flow the site's own JS runs, top to bottom -->
  <rect x="872" y="44" width="304" height="390" rx="10" fill="#0e2a4d" stroke="#6f8fbf" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1040" y="72" text-anchor="middle" fill="#e6f0ff" font-size="14">chatgpt.com &#183; signed-out</text>
  <text x="1040" y="90" text-anchor="middle" fill="#8fb3e0" font-size="9">cleared by the site's own JS, never reimplemented</text>

  <g stroke="#9cc4ff" stroke-width="1.5" fill="#0f3f52">
    <rect x="920" y="106" width="248" height="46" rx="6"/>
    <rect x="920" y="170" width="248" height="46" rx="6"/>
    <rect x="920" y="234" width="248" height="46" rx="6"/>
    <rect x="920" y="298" width="248" height="46" rx="6"/>
    <rect x="920" y="362" width="248" height="46" rx="6"/>
  </g>
  <g fill="#12335a" stroke="#9cc4ff" stroke-width="1.5">
    <circle cx="906" cy="129" r="9"/>
    <circle cx="906" cy="193" r="9"/>
    <circle cx="906" cy="257" r="9"/>
    <circle cx="906" cy="321" r="9"/>
    <circle cx="906" cy="385" r="9"/>
  </g>
  <g fill="#e6f0ff" font-size="9.5" text-anchor="middle">
    <text x="906" y="132">1</text>
    <text x="906" y="196">2</text>
    <text x="906" y="260">3</text>
    <text x="906" y="324">4</text>
    <text x="906" y="388">5</text>
  </g>
  <g fill="#e6f0ff" font-size="12.5" text-anchor="middle">
    <text x="1044" y="127">Turnstile</text>
    <text x="1044" y="191">Sentinel PoW</text>
    <text x="1044" y="255">conduit_token</text>
    <text x="1044" y="319">unauth-mweb</text>
    <text x="1044" y="383">answer &#8594; the DOM</text>
  </g>
  <g fill="#8fb3e0" font-size="9" text-anchor="middle">
    <text x="1044" y="142">Cloudflare challenge</text>
    <text x="1044" y="206">chat-requirements handshake</text>
    <text x="1044" y="270">from /conversation/prepare</text>
    <text x="1044" y="334">the conversation surface</text>
    <text x="1044" y="398">web-mobile-partial HTML, rendered</text>
  </g>

  <!-- flow -->
  <g stroke="#9cc4ff" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="120" y1="250" x2="140" y2="250"/>
    <line x1="284" y1="250" x2="308" y2="250"/>
    <path d="M462,250 C500,250 500,180 516,180"/>
    <path d="M462,250 C500,250 500,352 516,352"/>
    <line x1="680" y1="180" x2="734" y2="180"/>
    <path d="M844,176 C878,176 878,129 916,129"/>
    <line x1="1044" y1="152" x2="1044" y2="168"/>
    <line x1="1044" y1="216" x2="1044" y2="232"/>
    <line x1="1044" y1="280" x2="1044" y2="296"/>
    <line x1="1044" y1="344" x2="1044" y2="360"/>
  </g>
</svg>
