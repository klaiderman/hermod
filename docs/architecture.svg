<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9cc4ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 H0 V40" fill="none" stroke="#163457" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1040" height="300" rx="10" fill="#0b1e39"/>
  <rect x="0" y="0" width="1040" height="300" rx="10" fill="url(#grid)"/>
  <rect x="1" y="1" width="1038" height="298" rx="10" fill="none" stroke="#2b4d75" stroke-width="2"/>

  <!-- boxes -->
  <g stroke="#9cc4ff" stroke-width="2" fill="#12335a">
    <rect x="24"  y="122" width="110" height="56" rx="7"/>
    <rect x="168" y="122" width="150" height="56" rx="7"/>
    <rect x="352" y="118" width="160" height="64" rx="7"/>
    <rect x="596" y="44"  width="156" height="60" rx="7"/>
    <rect x="596" y="198" width="220" height="60" rx="7"/>
  </g>

  <!-- cylinders (the browser + the live site) -->
  <g stroke="#9cc4ff" stroke-width="2" fill="#0f3f52">
    <path d="M792,52 V96 A56,9 0 0 0 904,96 V52"/>
    <ellipse cx="848" cy="52" rx="56" ry="9"/>
    <path d="M928,52 V96 A54,9 0 0 0 1036,96 V52"/>
    <ellipse cx="982" cy="52" rx="54" ry="9"/>
  </g>

  <!-- primary labels -->
  <g fill="#e6f0ff" font-size="14" text-anchor="middle">
    <text x="79"  y="155">client</text>
    <text x="243" y="155">/v1/queries</text>
    <text x="432" y="147">ScrapeEngine</text>
    <text x="674" y="70">ChatGptStrategy</text>
    <text x="706" y="224">block detector</text>
    <text x="848" y="79">Chromium</text>
    <text x="982" y="79">chatgpt.com</text>
  </g>

  <!-- sub labels -->
  <g fill="#8fb3e0" font-size="10" text-anchor="middle">
    <text x="432" y="164">resilience &#183; four timers</text>
    <text x="674" y="88">drive UI &#183; read the DOM</text>
    <text x="706" y="242">status &#183; body &#183; DOM &#8594; typed errors</text>
    <text x="848" y="93">N incognito contexts</text>
    <text x="982" y="93">signed-out UI</text>
  </g>

  <!-- flow -->
  <g stroke="#9cc4ff" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="134" y1="150" x2="164" y2="150"/>
    <line x1="318" y1="150" x2="348" y2="150"/>
    <path d="M512,150 C556,150 556,74 592,74"/>
    <path d="M512,150 C556,150 556,228 592,228"/>
    <line x1="752" y1="74" x2="788" y2="74"/>
    <line x1="904" y1="74" x2="924" y2="74"/>
  </g>
</svg>
